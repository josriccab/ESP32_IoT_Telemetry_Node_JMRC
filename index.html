<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise IoT Dashboard - Smart Garden JMRC</title>
    <!-- Tailwind CSS for modern engineering UI layout -->
    <script src="https://tailwindcss.com"></script>
    <!-- Official MQTT browser client library via CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-6">

    <div class="max-w-5xl mx-auto">
        <!-- Header Section -->
        <header class="mb-8 border-b border-gray-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-green-400">🪴 Enterprise Smart Garden IoT</h1>
                <p class="text-sm text-gray-400 mt-1">ID Nodo: <span id="node-id" class="font-mono bg-gray-800 px-2 py-0.5 rounded text-gray-300">Awaiting...</span></p>
            </div>
            <div id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-yellow-500/20 text-yellow-400 border border-yellow-500/30">
                Connecting to Broker...
            </div>
        </header>

        <!-- Metrics Grid -->
        <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Temperature Card -->
            <div class="bg-gray-800/60 backdrop-blur-md p-6 rounded-2xl border border-gray-700/60 shadow-xl hover:border-green-500/50 transition-all duration-300">
                <div class="flex justify-between items-center text-gray-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">Temperature</span>
                    <span class="text-xl">🌡️</span>
                </div>
                <p class="text-4xl font-extrabold text-white mt-1">
                    <span id="val-temp">--</span> <span class="text-xl text-gray-400 font-normal">°C</span>
                </p>
            </div>

            <!-- Air Humidity Card -->
            <div class="bg-gray-800/60 backdrop-blur-md p-6 rounded-2xl border border-gray-700/60 shadow-xl hover:border-blue-500/50 transition-all duration-300">
                <div class="flex justify-between items-center text-gray-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">Air Humidity</span>
                    <span class="text-xl">💧</span>
                </div>
                <p class="text-4xl font-extrabold text-white mt-1">
                    <span id="val-hum">--</span> <span class="text-xl text-gray-400 font-normal">%</span>
                </p>
            </div>

            <!-- Light Level Card -->
            <div class="bg-gray-800/60 backdrop-blur-md p-6 rounded-2xl border border-gray-700/60 shadow-xl hover:border-yellow-500/50 transition-all duration-300">
                <div class="flex justify-between items-center text-gray-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">Light Level</span>
                    <span class="text-xl">☀️</span>
                </div>
                <p class="text-4xl font-extrabold text-white mt-1">
                    <span id="val-light">--</span> <span class="text-xl text-gray-400 font-normal">pts</span>
                </p>
            </div>

            <!-- Soil Moisture Card -->
           <div class="bg-gray-800/60 backdrop-blur-md p-6 rounded-2xl border border-gray-700/60 shadow-xl hover:border-emerald-500/50 transition-all duration-300">
                <div class="flex justify-between items-center text-gray-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">Soil Moisture</span>
                    <span class="text-xl">🌱</span>
                </div>
                <p class="text-4xl font-extrabold text-white mt-1">
                    <span id="val-soil">--</span> <span class="text-xl text-gray-400 font-normal">%</span>
                </p>
            </div>

            <!-- Pump Status Card -->
            <div class="bg-gray-800/60 backdrop-blur-md p-6 rounded-2xl border border-gray-700/60 shadow-xl hover:border-cyan-500/50 transition-all duration-300">
                <div class="flex justify-between items-center text-gray-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">Pump Status</span>
                    <span class="text-xl">⚙️</span>
                </div>
                <div class="mt-2">
                    <span id="val-pump" class="text-lg font-bold px-3 py-1 rounded-lg inline-block bg-gray-700 text-gray-300 border border-gray-600">
                        UNKNOWN
                    </span>
                </div>
            </div>>

            <!-- System Operational State Card -->
            <div class="bg-gray-800/60 backdrop-blur-md p-6 rounded-2xl border border-gray-700/60 shadow-xl hover:border-indigo-500/50 transition-all duration-300">
                <div class="flex justify-between items-center text-gray-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">System State</span>
                    <span class="text-xl">🛡️</span>
                </div>
                <p id="val-state" class="text-lg font-mono font-bold mt-2 text-indigo-400 truncate">
                    WAITING FOR DATA...
                </p>
            </div>

        </main>
        
        <footer class="mt-12 text-center text-xs text-gray-600">
            Last packet received: <span id="val-time" class="font-mono">--:--:--</span>
        </footer>
    </div>

    <!-- MQTT Secure WebSocket Client Logic -->
    <script>
        // Public HiveMQ Broker configuration via secure WebSockets
        const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
        const topic = 'garden/SmartGardenNode_JMRC_9999/telemetry';

        const client = mqtt.connect(brokerUrl);
        const badge = document.getElementById('status-badge');

        client.on('connect', () => {
            badge.innerText = "Conectado en Vivo";
            badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-green-500/20 text-green-400 border border-green-500/30";
            client.subscribe(topic);
        });

        client.on('error', (err) => {
            badge.innerText = "Error de Conexión";
            badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30";
            console.error(err);
        });

        // Parse incoming telemetry JSON and update DOM elements dynamically
        client.on('message', (receivedTopic, message) => {
            try {
                const data = JSON.parse(message.toString());
                
                // Inject clean formatted values into HTML elements
                document.getElementById('node-id').innerText = data.device_id;
                document.getElementById('val-temp').innerText = Number(data.temperature).toFixed(1);
                document.getElementById('val-hum').innerText = data.humidity;
                document.getElementById('val-light').innerText = data.light_raw;
                document.getElementById('val-soil').innerText = data.soil_moisture;
                document.getElementById('val-state').innerText = data.system_state;
                
                // Update timestamp for the last successfully processed packet
                const pump = document.getElementById('val-pump');
                pump.innerText = data.pump_status;
                if(data.pump_status === "ON") {
                    pump.className = "text-xl font-bold mt-3 px-3 py-1 rounded inline-block bg-blue-500/20 text-blue-400 border border-blue-500/30 animate-pulse";
                } else {
                    pump.className = "text-xl font-bold mt-3 px-3 py-1 rounded inline-block bg-red-500/20 text-red-400 border border-red-500/30";
                }

                // Update timestamp for the last successfully processed packet
                const ahora = new Date();
                document.getElementById('val-time').innerText = ahora.toLocaleTimeString();

            } catch (error) {
                console.error("El mensaje recibido no era un JSON válido:", error);
            }
        });
    </script>
</body>
</html>
